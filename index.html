<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%;background:#08090b}[hidden]{display:none!important}</style>
<title>Evrenin Ayar Düğmesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
</head><body>
<style>
/* layout: one full-bleed blackboard, close to black. Chalk dust (WebGL) fills the upper right; lower left a numbered
   title over a column of typeset equations with live values; the tuning knob lower right; scene navigation bottom centre.
   Single dark world on purpose: it is a blackboard. */
:root{
  color-scheme:dark;
  --board:#08090b;
  --board-hi:#14161b;
  --chalk:#eeeae0;
  --chalk-2:#b6b6b2;
  --chalk-3:#76787c;
  --line:rgba(236,231,218,.2);
  --yolk:#f0cc62;
  --rose:#f3a39c;
  --sky:#86c3e8;
  --mint:#93d6a6;
  --serif:"STIX Two Text",Georgia,"Times New Roman",serif;   /* the face of the physics journals */
  --type:"Courier Prime","Courier New",Courier,monospace;    /* the typed preprint */
  --math:KaTeX_Main,"STIX Two Text","Times New Roman",serif;  /* Computer Modern, the face of the equations */
  --gut:clamp(16px,2.6vw,40px);
  --nav-h:58px;
}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--chalk);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--board);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yolk);outline-offset:3px}

/* ---------- top bar */
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gut) 0;pointer-events:none;
  font-family:var(--type);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-2);transition:opacity .4s;z-index:3}
.top > *{pointer-events:auto}
/* a soft shade under the bar, so passing dust never sits on the letters */
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 78px);z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,9,11,.92),rgba(8,9,11,.6) 55%,rgba(8,9,11,0))}
.brand{display:flex;flex-wrap:wrap;gap:.2em 1.1em;min-width:0;padding-top:7px}
.brand b{color:var(--chalk);font-weight:700}
.where{color:var(--chalk-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:6px;flex:none}
.tools button{background:rgba(8,9,11,.55);border:1px solid var(--line);border-radius:2px;padding:6px 9px 5px;min-width:34px;min-height:30px;
  font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-2);cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.tools button:hover{color:var(--board);background:var(--chalk);border-color:var(--chalk)}

/* ---------- caption */
.caption{position:absolute;left:var(--gut);bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 18px);width:min(37rem,41vw);pointer-events:none;transition:opacity .25s}
.caption::before{content:"";position:absolute;inset:-70px -110px -120px -80px;z-index:-1;
  background:radial-gradient(closest-side,rgba(8,9,11,.95),rgba(8,9,11,.84) 55%,rgba(8,9,11,0))}
.kicker{max-width:35rem;margin:0 0 .7em;font-family:var(--type);font-size:clamp(11.5px,1.02vw,15px);letter-spacing:.16em;text-transform:uppercase;color:var(--yolk)}
.head{max-width:35rem;margin:0;font:600 clamp(23px,2.55vw,40px)/1.12 var(--serif);letter-spacing:-.008em;text-wrap:balance}
.sec{display:inline-block;margin-right:.75em;font:400 .56em/1 var(--math);color:var(--chalk-3);vertical-align:.32em;letter-spacing:.02em}
.lc{text-transform:none}

/* the equations: Computer Modern, one per row, the live value at the right */
.facts{margin-top:1em;max-width:35rem;font-size:clamp(14px,1.34vw,21px)}
.facts:empty{display:none}
.eq{display:flex;align-items:center;gap:.7em;min-height:2.7em;padding:.36em 0;border-top:1px solid var(--line)}
.eq:last-of-type{border-bottom:1px solid var(--line)}
.eq .tex{min-width:0}
.eq .tex .katex{white-space:nowrap}   /* a formula is never broken across lines */
.eq.two{display:grid;grid-template-columns:1fr 1fr auto;column-gap:1.3em}
.eq.two .cell{display:flex;align-items:center;min-width:0}
.eq.two .val{padding-left:.5em}
.eq .val{margin-left:auto;padding-left:1em;font:400 1.21em/1.2 var(--math);white-space:nowrap;color:var(--chalk);transition:color .25s}
.eq .val.off{color:var(--yolk)}
.eq .val .katex{font-size:1em}
.cite{pointer-events:auto;background:none;border:0;padding:.2em .15em;font-family:var(--type);font-size:.66em;color:var(--chalk-3);cursor:pointer;transition:color .2s}
.cite:hover{color:var(--chalk)}
.eqnote{margin-left:.2em;font-family:var(--type);font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-3);white-space:nowrap}

/* caption change: the old lines are wiped, the new ones are written from the left */
.caption.out{opacity:0}
.caption.in .kicker,.caption.in .head,.caption.in .eq,.caption.in .spec{animation:write .7s cubic-bezier(.2,.7,.2,1) both}
.caption.in .head{animation-delay:.08s}
.caption.in .eq{animation-delay:.22s}
.caption.in .eq:nth-child(2){animation-delay:.3s}
.caption.in .eq:nth-child(3){animation-delay:.38s}
.caption.in .eq:nth-child(4){animation-delay:.46s}
.caption.in .eq:nth-child(n+5),.caption.in .spec{animation-delay:.54s}
@keyframes write{from{clip-path:inset(0 100% 0 0);opacity:.2;transform:translateY(6px)}to{clip-path:inset(-12% -4% -12% -2%);opacity:1;transform:none}}

/* spectrum strip (atom scene) */
.spec{position:relative;height:30px;margin-top:1.5em;border:1px solid var(--line);
  background:
   linear-gradient(90deg,#000 0,#000 16.2%,#3b0a6b 16.25%,#4a22d6 21%,#1f6cf0 27%,#19c6c2 30.5%,#2fd84a 34%,#d7e03a 40.5%,#f1a12a 44%,#ee3a24 50%,#7a0f0c 62.5%,#000 62.55%);
}
.spec::after{content:"";position:absolute;inset:0;background:rgba(8,9,11,.14)}
.spec i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--chalk);z-index:1;box-shadow:0 0 8px 1px rgba(236,231,218,.55);transition:opacity .2s}
.spec i::after{content:attr(data-n);position:absolute;top:-1.35em;left:50%;transform:translateX(-50%);font:italic 400 14px KaTeX_Math,var(--serif);color:var(--chalk-2);white-space:nowrap}
.spec i:nth-child(n+3)::after{top:auto;bottom:-1.35em}
.spec i:nth-child(4)::after{transform:translateX(-85%)}
.spec i:nth-child(3)::after{transform:translateX(-15%)}
.spec-ends{display:flex;justify-content:space-between;font:400 .82em var(--math);color:var(--chalk-3);padding-top:1.3em}

/* ---------- labels pinned to points in the dust */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font-family:var(--type);font-size:clamp(13px,1.3vw,20px);letter-spacing:.04em;color:var(--chalk);
  white-space:nowrap;opacity:0;transition:opacity .7s;will-change:transform;text-shadow:0 0 6px var(--board),0 0 12px var(--board)}
.lab.on{opacity:1}
.lab.hot{color:var(--yolk)}
.lab.tag{color:var(--chalk-2);text-shadow:0 0 4px var(--board),0 0 10px var(--board),0 0 18px var(--board)}
.lab.bad{color:var(--rose)}
.lab.ctr{text-align:center;line-height:1.4}
.lab.lab.bad{color:var(--rose)}   /* a broken node's name turns rose, even a maths label */
.lab .rng{font-family:var(--math);font-size:.92em;letter-spacing:0;color:var(--chalk-2)}
.lab .rng i{font-family:KaTeX_Math,var(--serif)}
.lab.good{color:var(--mint)}
.lab.cool{color:var(--sky)}
.lab.big{font-family:var(--math);font-size:clamp(16px,1.75vw,26px);letter-spacing:0;color:var(--chalk)}
.lab.big i{font-family:KaTeX_Math,var(--serif);font-style:italic}
.lab.num{font-family:var(--math);font-size:clamp(14px,1.45vw,22px);letter-spacing:0}
.lab sup,.lab sub{font-size:.66em;line-height:0}
.lab .lg{margin-left:.55em;font-family:var(--type);font-size:.5em;letter-spacing:.12em;color:var(--chalk-3);vertical-align:.2em}

/* ---------- the knob */
.dock{display:contents}
.knob{position:absolute;right:var(--gut);bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 4px);width:clamp(168px,18.5vw,262px);
  display:grid;justify-items:center;gap:4px;touch-action:none}
.knob::before{content:"";position:absolute;inset:-36px -44px -30px -44px;z-index:-1;background:radial-gradient(closest-side,rgba(8,9,11,.86),rgba(8,9,11,.6) 60%,rgba(8,9,11,0))}
.k-read{display:grid;justify-items:center;gap:4px}
.knob svg{display:block;width:100%;height:auto;overflow:visible;cursor:grab;touch-action:none}
.knob svg.drag{cursor:grabbing}
.k-scale{fill:none;stroke:var(--chalk-2);stroke-width:1.7;stroke-linecap:round}
.k-life{fill:none;stroke:var(--mint);stroke-width:7;stroke-linecap:butt}
.k-h{fill:none;stroke:var(--rose);stroke-width:4.5;stroke-linecap:round}
.k-out{fill:none;stroke:var(--rose);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 6;opacity:.75}
.k-rim{fill:rgba(8,9,11,.55);stroke:var(--chalk);stroke-width:2.4}
.k-needle{stroke:var(--yolk);stroke-width:4.5;stroke-linecap:round}
.k-txt{font-family:var(--type);font-size:13.5px;letter-spacing:.04em;fill:var(--chalk-2)}
.k-edge{font-family:KaTeX_Main,var(--serif);font-size:13px;fill:var(--mint);letter-spacing:0}
.k-cap{stroke:var(--mint);stroke-width:2.6;stroke-linecap:round}
.k-137{font-family:KaTeX_Main,var(--serif);font-size:15.5px;fill:var(--mint);letter-spacing:0}
.ma{font-family:KaTeX_Math,var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0}
.k-alpha{font-family:KaTeX_Math,var(--serif);font-style:italic;font-size:50px;fill:var(--chalk);transition:fill .3s;pointer-events:none}
.k-alpha[data-z="edge"]{fill:var(--yolk)}
.k-alpha[data-z="noC"],.k-alpha[data-z="noO"],.k-alpha[data-z="h"]{fill:var(--rose)}
.read{font:400 clamp(24px,2.5vw,38px)/1 var(--math);white-space:nowrap}
.read .tex{font-size:.62em;color:var(--chalk-2);margin-right:.3em}
.zone{min-height:1.2em;font-family:var(--type);font-size:clamp(12px,1.1vw,17px);letter-spacing:.1em;text-transform:uppercase;color:var(--mint);transition:color .3s;white-space:nowrap}
.zone[data-z="edge"]{color:var(--yolk)}
.zone[data-z="noC"],.zone[data-z="noO"],.zone[data-z="h"]{color:var(--rose)}
.reset{margin-top:2px;background:none;border:0;border-bottom:1px dashed var(--chalk-3);padding:2px 1px;font-family:var(--type);font-size:clamp(12px,.95vw,14px);letter-spacing:.06em;color:var(--chalk-2);cursor:pointer;transition:opacity .3s,color .2s}
.reset:hover{color:var(--chalk)}
.reset[disabled]{opacity:0;pointer-events:none}
.hint{position:absolute;right:0;bottom:100%;margin-bottom:8px;width:max-content;max-width:60vw;font-family:var(--type);font-size:clamp(12px,.98vw,14.5px);letter-spacing:.05em;color:var(--yolk);
  animation:nudge 2.2s ease-in-out infinite;transition:opacity .5s;pointer-events:none;text-align:right}
.hint.gone{opacity:0;animation:none}
@keyframes nudge{50%{transform:translateY(-5px)}}

/* ---------- navigation */
.nav{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;transition:opacity .4s}
.nav::before{content:"";position:absolute;inset:-14px -40px -14px -40px;z-index:-1;background:radial-gradient(closest-side,rgba(8,9,11,.88),rgba(8,9,11,0))}
.arrow{width:40px;height:36px;background:none;border:1px solid var(--line);border-radius:2px;font-family:var(--type);font-size:17px;line-height:1;color:var(--chalk-2);cursor:pointer;transition:color .2s,background .2s,border-color .2s,opacity .3s}
.arrow:hover{color:var(--board);background:var(--chalk);border-color:var(--chalk)}
.arrow[disabled]{opacity:.25;pointer-events:none}
.pips{display:flex;align-items:center;margin:0 6px}
.pip{width:24px;height:36px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.pip::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--chalk-3);transition:width .45s cubic-bezier(.3,1.5,.5,1),background .3s}
.pip:hover::before{background:var(--chalk)}
.pip[aria-current="true"]::before{width:20px;background:var(--yolk)}

/* ---------- sheets (sources, keys) */
.sheet{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 20px);
  background:rgba(5,6,8,.84);-webkit-user-select:text;user-select:text;touch-action:auto}
.sheet-in{position:relative;width:min(46rem,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--board-hi);border:1px solid var(--line);padding:clamp(18px,3vw,36px)}
/* the list fades out at the bottom edge, so a cut line reads as "more below" */
.sheet-in::after{content:"";display:block;position:sticky;bottom:calc(-1 * clamp(18px,3vw,36px));height:34px;margin:-34px calc(-1 * clamp(18px,3vw,36px)) calc(-1 * clamp(18px,3vw,36px));background:linear-gradient(180deg,rgba(20,22,27,0),var(--board-hi) 70%);pointer-events:none;
  content:"↓";text-align:center;line-height:40px;font-family:var(--type);font-size:13px;color:var(--chalk-2);transition:opacity .25s}
.sheet-in.end::after{opacity:0}
.sheet[hidden]{display:none}
.sheet h2{margin:0 0 .7em;font:600 clamp(22px,2.4vw,32px)/1.1 var(--serif)}
.sheet ol,.sheet dl{margin:0;padding:0;list-style:none;display:grid;gap:.85em;font-size:clamp(14px,1.15vw,17px);line-height:1.4}
.sheet li{position:relative;padding-left:2.2em}
.sheet li::before{content:attr(data-n);position:absolute;left:0;top:.18em;font-family:var(--type);font-size:.85em;color:var(--yolk)}
.sheet a{color:var(--sky);text-underline-offset:3px;word-break:break-word}
.sheet em{color:var(--chalk-2)}
.sheet dl{grid-template-columns:auto 1fr;gap:.55em 1.4em;align-items:baseline}
.sheet dt{font-family:var(--type);font-size:.9em;color:var(--yolk);white-space:nowrap}
.sheet dd{margin:0}
.sheet .x{position:sticky;float:right;top:0;margin:-6px -6px 0 12px;background:var(--board-hi);border:1px solid var(--line);border-radius:2px;padding:5px 10px;font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sheet .x:hover{background:var(--chalk);color:var(--board)}
.sheet p.small{margin:1.2em 0 0;font-family:var(--type);font-size:12.5px;line-height:1.5;color:var(--chalk-3)}

.fallback{position:absolute;left:var(--gut);top:20%;max-width:30rem;font-family:var(--type);font-size:13px;line-height:1.5;color:var(--rose)}

/* presenting: chrome fades away, the board stays */
#stage.clean .top,#stage.clean .nav{opacity:0;pointer-events:none}
#stage.clean .top > *{pointer-events:none}

/* ---------- narrow or tall screens: dust on top, words below */
@media (max-width:979px),(max-aspect-ratio:5/4){
  :root{--nav-h:52px}
  .top{font-size:11px}
  /* the knob rides on top of the caption; together they are docked to the bottom */
  .dock{position:absolute;left:var(--gut);right:var(--gut);bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 8px);display:flex;flex-direction:column;gap:14px;pointer-events:none}
  .dock{z-index:1}
  .dock::before{content:"";position:absolute;z-index:-1;inset:-56px calc(-1 * var(--gut)) calc(-1 * var(--nav-h) - 40px);background:linear-gradient(180deg,rgba(8,9,11,0),rgba(8,9,11,.9) 52px,rgba(8,9,11,.96))}
  .caption{position:relative;left:auto;bottom:auto;width:auto;order:1}
  .caption::before{display:none}
  .head{font-size:clamp(21px,5.6vw,34px)}
  .facts{font-size:clamp(12px,3.3vw,17px);margin-top:.7em}
  .eq{min-height:2.3em;padding:.24em 0;gap:.5em}
  .spec{height:24px}
  .knob{position:relative;right:auto;bottom:auto;order:2;align-self:flex-end;width:auto;grid-template-columns:auto auto;align-items:center;column-gap:12px;pointer-events:auto}
  .knob::before{display:none}
  .knob svg{grid-column:2;grid-row:1;width:clamp(108px,29vw,156px)}
  .k-read{grid-column:1;grid-row:1;justify-items:end;gap:2px}
  .read{font-size:clamp(20px,5.6vw,30px)}
  .zone{font-size:11px;letter-spacing:.08em}
  .reset{font-size:12px}
  .hint{font-size:12px;margin:0;bottom:0;right:calc(clamp(108px,29vw,156px) + 12px)}
  .knob svg text:not(.k-alpha){display:none}
  .lab{font-size:12px}
  .lab.big{font-size:16px}
  .lab.num{font-size:13.5px}
  .zone{font-size:11.5px}
}
@media (max-width:560px){
  .brand b{display:none}
  .tools button{padding:6px 7px 5px}
}
/* a projector or a short laptop screen: the caption and the knob give the figure more room */
@media (max-height:940px) and (min-aspect-ratio:5/4) and (min-width:980px){
  .kicker{margin-bottom:.45em}
  .head{font-size:clamp(21px,2.15vw,32px)}
  .facts{font-size:clamp(13px,1.18vw,18px);margin-top:.7em}
  .eq{min-height:2.25em;padding:.2em 0}
  .spec{height:22px}
  .knob{width:clamp(150px,15.5vw,215px)}
  .zone{font-size:clamp(11px,1.02vw,15px);letter-spacing:.08em}
}
@media (max-height:520px) and (min-aspect-ratio:5/4){
  .head{font-size:clamp(20px,3vw,28px)}
  .facts{font-size:13px}
  .eq{min-height:2.1em;padding:.15em 0}
  .knob{width:clamp(110px,15vw,150px)}
}
@media (pointer:coarse){
  #btnHelp{display:none}
}
@media (prefers-reduced-motion:reduce){
